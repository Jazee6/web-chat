<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Web Chat</title>
    <!-- 应用外壳：登录后的 /、邀请链接等 SPA 路由都返回它。供搜索与 AI 读的内容在介绍页（src/landing，ADR-0015），这里不收录；
         OG 留给在别的应用里分享邀请链接时的预览，图片与介绍页一样用官网的绝对地址 -->
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="Open-source, Telegram-style chat on Cloudflare Workers: groups, end-to-end encrypted secret chats, calls, media and offline-first sync. Deploy your own on the free plan."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Web Chat" />
    <meta property="og:title" content="Web Chat · Open-source Telegram-style chat on Cloudflare" />
    <meta
      property="og:description"
      content="Groups, end-to-end encrypted secret chats, voice and video calls, media and offline-first sync, all on Cloudflare Workers, Durable Objects, D1 and R2."
    />
    <meta property="og:image" content="https://chat.jaze.top/og-en.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Web Chat: a group conversation with replies, reactions, a voice message and a link preview" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Web Chat</h1>
      <p>
        An open-source, Telegram-style chat app that runs entirely on Cloudflare Workers, Durable Objects, D1 and R2.
        Web Chat needs JavaScript. Source code and deployment guide:
        <a href="https://github.com/Jazee6/web-chat">github.com/Jazee6/web-chat</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
