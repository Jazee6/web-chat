<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Web Chat</title>
    <!-- 所有部署共用：介绍的是开源项目本身，图片用 GitHub 上的绝对地址，不写 canonical -->
    <meta
      name="description"
      content="Open-source, Telegram-style chat on Cloudflare Workers: groups, end-to-end encrypted secret chats, calls, media and offline-first sync. Deploy your own on the free plan."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Web Chat" />
    <meta property="og:title" content="Web Chat · Open-source Telegram-style chat on Cloudflare" />
    <meta
      property="og:description"
      content="Groups, end-to-end encrypted secret chats, voice and video calls, media and offline-first sync, all on Cloudflare Workers, Durable Objects, D1 and R2."
    />
    <meta property="og:image" content="https://raw.githubusercontent.com/Jazee6/web-chat/main/docs/screenshot.png" />
    <meta property="og:image:width" content="2560" />
    <meta property="og:image:height" content="1600" />
    <meta property="og:image:alt" content="Web Chat with the chat list on the left and a conversation on the right" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Web Chat",
        "description": "An open-source, Telegram-style chat app that runs entirely on the Cloudflare developer platform (Workers, Durable Objects, D1, R2) and fits the Workers Free plan.",
        "applicationCategory": "CommunicationApplication",
        "operatingSystem": "Web",
        "browserRequirements": "Requires JavaScript, WebAssembly and the Origin Private File System",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "image": "https://raw.githubusercontent.com/Jazee6/web-chat/main/docs/screenshot.png",
        "sameAs": "https://github.com/Jazee6/web-chat",
        "featureList": [
          "Private chats and groups of up to 20 members",
          "End-to-end encrypted secret chats (MLS) across devices",
          "Photos, videos, files, voice messages, stickers and link previews",
          "One-to-one and group voice and video calls with screen sharing",
          "Local-first: messages stored in SQLite in the browser, offline and synced across devices",
          "Installable PWA with Web Push notifications",
          "Sign in with any OpenID Connect provider"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Web Chat</h1>
      <p>
        An open-source, Telegram-style chat app that runs entirely on Cloudflare Workers, Durable Objects, D1 and R2.
        Web Chat needs JavaScript. Source code and deployment guide:
        <a href="https://github.com/Jazee6/web-chat">github.com/Jazee6/web-chat</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
